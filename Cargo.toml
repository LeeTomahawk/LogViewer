[workspace]
resolver = "3"
members = ["crates/logview-core", "crates/logview-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
logview-core = { path = "crates/logview-core" }
memmap2 = "0.9"
memchr = "2"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["alloc", "std", "clock"] }
serde_json = { version = "1", features = ["preserve_order"] }
rayon = "1"
thiserror = "2"
anyhow = "1"
eframe = "0.31"
rfd = "0.15"
elsa = "1"
notify = "6"
encoding_rs = "0.8"
flate2 = "1"
zstd = "0.13"
criterion = "0.5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "5"

[profile.release]
debug = 1

# Builds for distribution (portable zip, installer): `cargo build --profile dist`.
# Smaller and a bit faster than `release`, no debug info, slower to compile.
[profile.dist]
inherits = "release"
debug = 0
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"

# Faster debug builds of the GUI: optimise dependencies even in dev.
[profile.dev.package."*"]
opt-level = 2
